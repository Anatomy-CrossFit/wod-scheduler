<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOD 캘린더 — 한 달 운동 스케줄 생성기</title>
<!-- PNG/JPG 내보내기용 (GitHub Pages에서 CDN 로드 가능) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- 배포 시 v를 올려서 브라우저 캐시가 옛 로직을 붙잡지 않게 함 -->
<script src="wodgen.js?v=13"></script>
<style>
  /* html2canvas 호환을 위해 색상은 hex/rgb만 사용 (oklch 금지) */
  :root {
    --bg: #ffffff;
    --panel: #f7f9fb;
    --panel2: #eef2f6;
    --line: #dde3ec;
    --text: #1e2633;
    --muted: #748091;
    --accent: #1a6fcf;      /* 블루 하이라이트 */
    --accent-dark: #14589f;

    /* 카테고리 색 (크로스핏_통합 시트와 동일) */
    --red: #e06666;      /* Squat */
    --blue: #4a86e8;     /* Clean */
    --purple: #8e7cc3;   /* Snatch */
    --orange: #f6b26b;   /* Deadlift */
    --green: #93c47d;    /* Press · Jerk */
    --plum: #a64d79;     /* 벤치마크 */
    --teal: #45818e;     /* 파트너 */
    --pink: #f4cccc;     /* 게임 */
    --yellow: #ffd966;   /* 유산소 · 오픈 */
    --tline: #9aa0a6;    /* 표 테두리 */
    --datebg: #dce9f9;   /* 날짜 행 배경 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  /* ── 헤더 ─────────────────────────── */
  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  header h1 .dot { color: var(--accent); }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* ── 컨트롤 패널 ───────────────────── */
  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: flex-end;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  select, .month-nav {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  select:focus { outline: 2px solid var(--accent-dark); }
  .month-nav { display: flex; align-items: center; gap: 4px; padding: 4px; }
  .month-nav button {
    background: none; border: none; color: var(--text);
    font-size: 16px; cursor: pointer; padding: 5px 10px; border-radius: 6px;
  }
  .month-nav button:hover { background: var(--line); }
  .month-nav .label { font-weight: 700; font-size: 14px; min-width: 96px; text-align: center; }

  .btn {
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 700; font-family: inherit;
    padding: 11px 18px;
    transition: transform 0.06s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #ffffff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { border-color: var(--muted); }
  .spacer { flex: 1; }

  /* ── 캡처 영역 (이미지로 내보내는 부분) ── */
  #capture {
    background: var(--bg);
    border-radius: 16px;
    padding: 22px 16px 26px;
    border: 1px solid var(--line);
  }
  .cal-head { text-align: center; margin-bottom: 12px; }
  .cal-head .month-big { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .cal-head .month-big span { color: var(--accent); }
  .cal-head .sub { color: var(--muted); font-size: 12px; margin-top: 4px; letter-spacing: 2px; }

  /* 범례 */
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px 12px; margin: 0 0 16px; font-size: 12px; color: var(--text);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sw {
    width: 13px; height: 13px; border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.12); display: inline-block;
  }

  /* ── 주간 테이블 (참조 시트 형식: 월~금) ── */
  table.week {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    margin-bottom: 14px; background: #ffffff;
  }
  table.week col.lbl { width: 64px; }
  table.week td {
    border: 1px solid var(--tline);
    vertical-align: middle; text-align: center;
    padding: 7px 6px;
    font-size: 12px; line-height: 1.45;
    word-break: break-word; overflow-wrap: break-word;
    white-space: normal;              /* 절대 ...으로 잘리지 않도록 */
  }
  td.rowlbl { background: #f8f9fa; font-weight: 700; font-size: 11px; color: #3c4043; }
  td.dt { background: var(--datebg); font-weight: 700; font-size: 12.5px; height: 28px; color: #14335e; }
  td.dt.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.cell { min-height: 60px; cursor: pointer; }
  td.cell:hover { filter: brightness(0.96); }
  td.cell .top { font-weight: 800; font-size: 12px; margin-bottom: 2px; }
  td.cell.c-empty { background: #f4f5f7; cursor: default; }

  .c-red    { background: var(--red);    color: #fff; }
  .c-blue   { background: var(--blue);   color: #fff; }
  .c-purple { background: var(--purple); color: #fff; }
  .c-orange { background: var(--orange); color: #fff; }
  .c-green  { background: var(--green);  color: #fff; }
  .c-plum   { background: var(--plum);   color: #fff; }
  .c-teal   { background: var(--teal);   color: #fff; }
  .c-pink   { background: var(--pink);   color: #5b2b2b; }
  .c-yellow { background: var(--yellow); color: #3a2f00; }
  .c-white  { background: #ffffff; color: var(--text); }
  .c-rest {
    background: repeating-linear-gradient(45deg, #e9ebee, #e9ebee 9px, #dcdfe3 9px, #dcdfe3 18px);
    color: #9aa0a6; font-weight: 800; letter-spacing: 2px;
  }
  .c-hol {
    background: repeating-linear-gradient(45deg, #fdeaea, #fdeaea 9px, #f7d3d3 9px, #f7d3d3 18px);
    color: #b3403f; font-weight: 800;
  }
  .c-hol .hn { display: block; font-weight: 600; font-size: 10.5px; margin-top: 3px; opacity: 0.85; }

  .cal-foot {
    margin-top: 14px; text-align: center;
    color: var(--muted); font-size: 11px; letter-spacing: 1px;
  }
  .cal-foot b { color: var(--accent); font-weight: 700; }

  /* ── 내보내기 버튼 ─────────────────── */
  .export-bar {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 18px; flex-wrap: wrap;
  }
  .export-bar .hint { width: 100%; text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* ── 상세 모달 ────────────────────── */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(20,30,45,0.4);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 16px;
    width: 100%; max-width: 400px;
    max-height: 84vh; overflow-y: auto;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(20,30,45,0.18);
  }
  .modal .m-date { color: var(--muted); font-size: 13px; font-weight: 600; }
  .modal .m-slot { color: var(--accent); font-size: 13px; font-weight: 800; margin-top: 8px; letter-spacing: 1px; }
  .modal .m-body {
    margin: 8px 0 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 36px 12px 14px;
    font-size: 14px; line-height: 1.6;
    position: relative;
  }
  .m-edit {
    position: absolute; right: 6px; bottom: 6px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 6px; border-radius: 6px; line-height: 0;
  }
  .m-edit:hover { color: var(--accent); background: var(--panel2); }
  .m-textarea {
    width: 100%; margin: 8px 0 18px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 14px; line-height: 1.6; color: var(--text);
    resize: vertical;
  }
  .m-textarea:focus { outline: 2px solid var(--accent-dark); }
  .modal .m-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal .m-actions .btn { flex: 1; padding: 10px; font-size: 13px; white-space: nowrap; }
  .modal .m-rest-note { text-align: center; color: #9aa0a6; font-weight: 800; letter-spacing: 3px; padding: 26px 0; }

  /* ── 토스트 ───────────────────────── */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--accent); color: #ffffff;
    font-size: 13px; font-weight: 700;
    padding: 10px 18px; border-radius: 99px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    z-index: 60;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 560px) {
    body { padding: 14px 6px 50px; }
    #capture { padding: 14px 6px 18px; }
    table.week td { font-size: 10px; padding: 4px 3px; }
    table.week col.lbl { width: 46px; }
    td.rowlbl { font-size: 9.5px; }
    td.dt { font-size: 11px; }
    .cal-head .month-big { font-size: 24px; }
    .controls { padding: 12px; }
    .legend { font-size: 10.5px; gap: 6px 9px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>WOD 캘린더<span class="dot">.</span></h1>
    <p>한 달 운동 스케줄(월~금)을 생성하고, 이미지로 저장해 사진첩에서 확인하세요</p>
  </header>

  <div class="controls">
    <div class="field">
      <label>월 선택</label>
      <div class="month-nav">
        <button id="prevMonth" aria-label="이전 달">◀</button>
        <div class="label" id="monthLabel"></div>
        <button id="nextMonth" aria-label="다음 달">▶</button>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="generate">스케줄 생성</button>
  </div>

  <div id="capture">
    <div class="cal-head">
      <div class="month-big" id="captureTitle"></div>
      <div class="sub">MONTHLY WOD SCHEDULE · MON–FRI</div>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--red)"></i>Squat</span>
      <span><i class="sw" style="background:var(--blue)"></i>Clean</span>
      <span><i class="sw" style="background:var(--purple)"></i>Snatch</span>
      <span><i class="sw" style="background:var(--orange)"></i>Deadlift</span>
      <span><i class="sw" style="background:var(--green)"></i>Press·Jerk</span>
      <span><i class="sw" style="background:var(--plum)"></i>벤치마크·기념일</span>
      <span><i class="sw" style="background:var(--teal)"></i>파트너</span>
      <span><i class="sw" style="background:var(--yellow)"></i>유산소</span>
      <span><i class="sw" style="background:repeating-linear-gradient(45deg,#fdeaea,#fdeaea 4px,#f7d3d3 4px,#f7d3d3 8px)"></i>공휴일</span>
      <span><i class="sw" style="background:repeating-linear-gradient(45deg,#e9ebee,#e9ebee 4px,#dcdfe3 4px,#dcdfe3 8px)"></i>휴식</span>
    </div>
    <div id="weeks"></div>
    <div class="cal-foot">MADE WITH <b>WOD CAL</b></div>
  </div>

  <div class="export-bar">
    <button class="btn btn-primary" id="savePng">PNG로 저장</button>
    <button class="btn btn-ghost" id="saveJpg">JPG로 저장</button>
    <button class="btn btn-ghost" id="saveAll">모두 내려받기</button>
    <div class="hint">저장한 이미지는 핸드폰 사진첩(갤러리)에서 바로 볼 수 있어요 · 모두 내려받기는 생성해 둔 모든 달을 PNG로 저장해요</div>
  </div>

</div>

<!-- 상세 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   UI — 생성 로직은 wodgen.js (generateMonthSchedule / regenDaySlot)
   ============================================================ */
const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();           // 0-11
let schedule = {};                          // { "YYYY-MM-DD": day객체 }

const $ = (id) => document.getElementById(id);
const padN = (n) => String(n).padStart(2, "0");
const keyOf = (y, m, d) => `${y}-${padN(m + 1)}-${padN(d)}`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

function generateSchedule() {
  schedule = generateMonthSchedule(viewYear, viewMonth);
  storeMonth(viewYear, viewMonth, schedule);
  renderCalendar();
  toast("스케줄이 생성되었습니다");
}
function loadOrEmpty() {
  schedule = loadMonth(viewYear, viewMonth) || {};
  renderCalendar();
}

/* ── 캘린더 렌더: 주 단위 테이블(월~금) ── */
const WD_NAMES = ["월", "화", "수", "목", "금"];

function weekdaysOfMonth() {
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  const weeks = [];
  let cur = null;
  for (let d = 1; d <= days; d++) {
    const dow = new Date(viewYear, viewMonth, d).getDay();
    if (dow === 0 || dow === 6) continue;
    if (dow === 1 || cur === null) { cur = []; weeks.push(cur); }
    cur.push({ d, dow });
  }
  return weeks;
}

function bodyHtml(text) {
  return esc(text).split("\n").join("<br>");
}

function renderCalendar() {
  $("monthLabel").textContent = `${viewYear}년 ${viewMonth + 1}월`;
  $("captureTitle").innerHTML = `${viewYear} <span>${padN(viewMonth + 1)}</span>`;

  const weeksEl = $("weeks");
  weeksEl.innerHTML = "";
  const weeks = weekdaysOfMonth();

  for (const week of weeks) {
    const byDow = {};
    for (const item of week) byDow[item.dow] = item;

    let rowWd = "", rowDt = "", rowS = "", rowM = "";
    for (let dow = 1; dow <= 5; dow++) {
      rowWd += `<td class="dt" style="background:#eef2f6;color:#5f6a7d">${WD_NAMES[dow - 1]}</td>`;
      const item = byDow[dow];
      if (!item) {
        rowDt += `<td class="dt"></td>`;
        rowS += `<td class="cell c-empty"></td>`;
        rowM += `<td class="cell c-empty"></td>`;
        continue;
      }
      const key = keyOf(viewYear, viewMonth, item.d);
      const isToday =
        item.d === today.getDate() &&
        viewMonth === today.getMonth() &&
        viewYear === today.getFullYear();
      rowDt += `<td class="dt${isToday ? " today" : ""}">${viewMonth + 1}/${item.d}</td>`;

      const day = schedule[key];
      if (!day) {
        rowS += `<td class="cell c-empty"></td>`;
        rowM += `<td class="cell c-empty"></td>`;
      } else if (day.kind === "holiday") {
        rowS += `<td class="cell c-hol" rowspan="2" data-key="${key}" data-slot="holiday">공휴일<span class="hn">${esc(day.name)}</span></td>`;
      } else if (day.kind === "rest") {
        rowS += `<td class="cell c-rest" rowspan="2" data-key="${key}" data-slot="rest">휴식</td>`;
      } else if (day.kind === "cardio") {
        const c = day.cardio;
        rowS += `<td class="cell c-${c.cat}${c.event ? " event-day" : ""}" rowspan="2" data-key="${key}" data-slot="cardio">${bodyHtml(c.body)}</td>`;
      } else {
        /* mwf */
        const s = day.strength, m = day.metcon;
        rowS += `<td class="cell c-${s.cat}" data-key="${key}" data-slot="strength"><div class="top">${esc(s.top)}</div>${bodyHtml(s.body)}</td>`;
        rowM += `<td class="cell c-${m.cat}" data-key="${key}" data-slot="metcon">${bodyHtml(m.body)}</td>`;
      }
    }

    const table = document.createElement("table");
    table.className = "week";
    table.innerHTML = `
      <colgroup><col class="lbl"><col><col><col><col><col></colgroup>
      <tr><td class="rowlbl"></td>${rowWd}</tr>
      <tr><td class="rowlbl"></td>${rowDt}</tr>
      <tr><td class="rowlbl">Strength</td>${rowS}</tr>
      <tr><td class="rowlbl">METCON</td>${rowM}</tr>`;
    weeksEl.appendChild(table);
  }

  weeksEl.querySelectorAll("td.cell:not(.c-empty)").forEach((td) => {
    td.addEventListener("click", () => openModal(td.dataset.key, td.dataset.slot));
  });

  /* GAMES/OPEN 첫 공개일 셀: 첫 줄(이벤트명)을 볼드로 */
  weeksEl.querySelectorAll("td.cell.event-day").forEach((td) => boldFirstLine(td, "14px"));
}

/* 요소의 첫 텍스트 노드(첫 줄)를 볼드 처리 — DOM API 사용 */
function boldFirstLine(el, fontSize) {
  if (!el || !el.firstChild || el.firstChild.nodeType !== 3) return;
  const strong = document.createElement("b");
  strong.style.fontSize = fontSize;
  strong.style.letterSpacing = "0.5px";
  strong.textContent = el.firstChild.textContent;
  el.replaceChild(strong, el.firstChild);
}

/* ── 상세 모달 ── */
function openModal(key, slot) {
  const day = schedule[key];
  if (!day) return;
  const [y, m, d] = key.split("-").map(Number);
  const dateStr = `${y}년 ${m}월 ${d}일`;
  const modal = $("modal");

  if (slot === "holiday") {
    modal.innerHTML = `
      <div class="m-date">${dateStr}</div>
      <div class="m-rest-note">공휴일 — ${esc(day.name)}</div>
      <div class="m-actions"><button class="btn btn-ghost" onclick="closeModal()">닫기</button></div>`;
  } else if (slot === "rest") {
    modal.innerHTML = `
      <div class="m-date">${dateStr}</div>
      <div class="m-rest-note">REST DAY</div>
      <div class="m-actions">
        <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
        <button class="btn btn-primary" onclick="toggleRest('${key}')">운동일로 전환</button>
      </div>`;
  } else if (slot === "cardio") {
    const c = day.cardio;
    const label = c.event ? "OPEN / GAMES" : c.minirox ? "MINI ROX" : c.benchmark || c.special ? "BENCHMARK" : c.partner ? "PARTNER" : "CARDIO";
    const canReroll = !(c.minirox || c.benchmark || c.special);
    modal.innerHTML = `
      <div class="m-date">${dateStr}</div>
      <div class="m-slot">${label}</div>
      <div class="m-body">${bodyHtml(c.body)}</div>
      <div class="m-actions">
        <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
        ${canReroll ? `<button class="btn btn-ghost" onclick="rerollDay('${key}','cardio')">다시 뽑기</button>` : ""}
        <button class="btn btn-primary" onclick="toggleRest('${key}')">휴식일로</button>
      </div>`;
  } else if (slot === "strength") {
    const s = day.strength;
    modal.innerHTML = `
      <div class="m-date">${dateStr}</div>
      <div class="m-slot">STRENGTH</div>
      <div class="m-body">${esc(s.top)} ${esc(s.body)}<br><span style="color:var(--muted);font-size:12px">주간 구성 제약(중복 금지·순서 규칙)에 묶여 있어 단독 재추첨은 지원하지 않아요</span></div>
      <div class="m-actions">
        <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
        <button class="btn btn-primary" onclick="toggleRest('${key}')">휴식일로</button>
      </div>`;
  } else {
    /* metcon */
    const mIt = day.metcon;
    const canReroll = !(mIt.benchmark || mIt.special || mIt.guess);
    const label = mIt.guess ? "PARTNER GAME" : mIt.benchmark || mIt.special ? "BENCHMARK" : mIt.partner ? "PARTNER METCON" : "METCON";
    modal.innerHTML = `
      <div class="m-date">${dateStr}</div>
      <div class="m-slot">${label}</div>
      <div class="m-body">${bodyHtml(mIt.body)}</div>
      <div class="m-actions">
        <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
        ${canReroll ? `<button class="btn btn-ghost" onclick="rerollDay('${key}','metcon')">다시 뽑기</button>` : ""}
        <button class="btn btn-primary" onclick="toggleRest('${key}')">휴식일로</button>
      </div>`;
  }
  /* 와드 텍스트 영역 우측 하단에 연필(직접 수정) 버튼 부착 */
  if (slot === "cardio" || slot === "metcon" || slot === "strength") {
    attachEditButton(key, slot);
  }
  /* 이벤트일 모달도 이벤트명 볼드 — boldFirstLine은 createElement/textContent만 사용(안전한 DOM 조작) */
  if (slot === "cardio" && day.cardio && day.cardio.event) {
    boldFirstLine(document.querySelector("#modal .m-body"), "15px");
  }
  $("modalBg").classList.add("open");
}
function closeModal() { $("modalBg").classList.remove("open"); }

/* ── 직접 수정 (연필 아이콘) — DOM API로 구성 ── */
function pencilSvg() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", "14");
  svg.setAttribute("height", "14");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", "M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z");
  svg.appendChild(p);
  return svg;
}
function attachEditButton(key, slot) {
  const body = $("modal").querySelector(".m-body");
  if (!body) return;
  const btn = document.createElement("button");
  btn.className = "m-edit";
  btn.title = "직접 수정";
  btn.setAttribute("aria-label", "직접 수정");
  btn.appendChild(pencilSvg());
  btn.addEventListener("click", () => startEdit(key, slot));
  body.appendChild(btn);
}
function slotText(day, slot) {
  if (slot === "cardio") return day.cardio.body;
  if (slot === "metcon") return day.metcon.body;
  if (slot === "strength") return day.strength.top + "\n" + day.strength.body;
  return "";
}
function startEdit(key, slot) {
  const day = schedule[key];
  if (!day) return;
  const [y, m, d] = key.split("-").map(Number);
  const modal = $("modal");
  modal.textContent = "";
  const mk = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text) el.textContent = text;
    return el;
  };
  modal.appendChild(mk("div", "m-date", `${y}년 ${m}월 ${d}일`));
  modal.appendChild(mk("div", "m-slot",
    slot === "strength" ? "직접 수정 — 첫 줄은 세트 표기(5x5 등)" : "직접 수정"));
  const ta = mk("textarea", "m-textarea");
  ta.id = "editArea";
  ta.spellcheck = false;
  ta.value = slotText(day, slot);
  modal.appendChild(ta);
  const actions = mk("div", "m-actions");
  const cancel = mk("button", "btn btn-ghost", "취소");
  cancel.addEventListener("click", () => openModal(key, slot));
  const save = mk("button", "btn btn-primary", "저장");
  save.addEventListener("click", () => saveEdit(key, slot));
  actions.appendChild(cancel);
  actions.appendChild(save);
  modal.appendChild(actions);
  ta.style.height = Math.min(420, Math.max(160, ta.value.split("\n").length * 26 + 30)) + "px";
  ta.focus();
}
function saveEdit(key, slot) {
  const day = schedule[key];
  const val = $("editArea").value.trim();
  if (!val) { toast("내용이 비어 있어요"); return; }
  if (slot === "strength") {
    const lines = val.split("\n");
    day.strength.top = lines[0];
    day.strength.body = lines.slice(1).join("\n");
  } else if (slot === "cardio") {
    day.cardio.body = val;
    day.cardio.edited = true;
  } else {
    day.metcon.body = val;
    day.metcon.edited = true;
  }
  storeMonth(viewYear, viewMonth, schedule);
  renderCalendar();
  openModal(key, slot);
  toast("수정한 내용을 저장했어요");
}

function toggleRest(key) {
  const day = schedule[key];
  if (day && day.kind === "rest") {
    schedule[key] = day.prev || { kind: "rest" };
  } else {
    schedule[key] = { kind: "rest", prev: day, key };
  }
  storeMonth(viewYear, viewMonth, schedule);
  closeModal();
  renderCalendar();
}
function rerollDay(key, slot) {
  schedule[key] = regenDaySlot(schedule[key], slot);
  storeMonth(viewYear, viewMonth, schedule);
  renderCalendar();
  openModal(key, slot);
}
$("modalBg").addEventListener("click", (e) => {
  if (e.target === $("modalBg")) closeModal();
});

/* ── 이미지 내보내기 ── */
async function exportImage(format, opts = {}) {
  if (typeof html2canvas === "undefined") {
    toast("이미지 라이브러리를 불러오지 못했어요 (인터넷 연결 확인)");
    return false;
  }
  const el = $("capture");
  // 핸드폰에서 선명하게 보이도록 1080px 폭 기준으로 스케일
  const scale = Math.max(2, 1080 / el.offsetWidth);
  if (!opts.silent) toast("이미지 생성 중...");
  try {
    const canvas = await html2canvas(el, {
      scale,
      backgroundColor: "#ffffff",
      useCORS: true,
    });
    const mime = format === "jpg" ? "image/jpeg" : "image/png";
    const url = canvas.toDataURL(mime, 0.92);
    const a = document.createElement("a");
    a.href = url;
    a.download = `wod_${viewYear}-${padN(viewMonth + 1)}.${format}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    if (!opts.silent) toast(`${format.toUpperCase()} 저장 완료! 사진첩에서 확인하세요`);
    return true;
  } catch (err) {
    console.error(err);
    toast("이미지 저장에 실패했어요");
    return false;
  }
}

/* 저장된 모든 달을 순서대로 PNG로 내려받기
   (브라우저가 "여러 파일 다운로드 허용"을 물으면 허용해야 함) */
async function exportAllMonths() {
  const keys = listStoredMonths();
  if (!keys.length) { toast("생성해 둔 스케줄이 없어요"); return; }
  const origY = viewYear, origM = viewMonth;
  let done = 0;
  for (const k of keys) {
    const [y, m] = k.split("-").map(Number);
    viewYear = y; viewMonth = m - 1;
    schedule = loadMonth(viewYear, viewMonth) || {};
    renderCalendar();
    await new Promise((r) => setTimeout(r, 150)); // 렌더 안정화
    toast(`내려받는 중... ${done + 1}/${keys.length} (${k})`);
    if (await exportImage("png", { silent: true })) done++;
    await new Promise((r) => setTimeout(r, 350)); // 연속 다운로드 간격
  }
  viewYear = origY; viewMonth = origM;
  loadOrEmpty();
  toast(`${done}개 월 이미지 저장 완료`);
}

/* ── 이벤트 바인딩 ── */
$("generate").addEventListener("click", generateSchedule);
$("savePng").addEventListener("click", () => exportImage("png"));
$("saveJpg").addEventListener("click", () => exportImage("jpg"));
$("saveAll").addEventListener("click", exportAllMonths);
$("prevMonth").addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  loadOrEmpty();
});
$("nextMonth").addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  loadOrEmpty();
});

/* ── 초기 렌더: 저장된 스케줄이 있으면 불러오고, 없으면 생성 ── */
if (loadMonth(viewYear, viewMonth)) loadOrEmpty();
else generateSchedule();
</script>
